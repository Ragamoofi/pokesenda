<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PokéSenda · Generador index UTCtime</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#07111d;color:#eef6ff;margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.box{width:min(760px,95vw);background:#0d1b2b;border:1px solid #35516d;border-radius:18px;padding:22px;box-shadow:0 24px 70px #0008}h1{font-size:22px;margin:0 0 8px}p{color:#a9bdd4;line-height:1.5}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}button,label.btn{border:1px solid #456887;background:#17314e;color:#fff;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.ok{color:#8fe0aa}.bad{color:#ff9aa6}.status{margin-top:16px;padding:12px;border:1px solid #35516d;border-radius:10px;background:#081725;white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px}input[type=file]{display:none}
</style>
</head>
<body>
<div class="box">
<h1>PokéSenda · Parche UTCtime.app</h1>
<p>Selecciona la build actual <b>PokeSenda_V36.64.9_TRABAJO_Auditoria_Profunda_Kanto_Johto.html</b>. El parche solo amplía la verificación horaria del Gachapón Premium y genera un <b>index.html</b> nuevo.</p>
<div class="row">
<label class="btn">1. Seleccionar HTML<input id="file" type="file" accept=".html,text/html"></label>
<button id="make" disabled>2. Generar index.html</button>
</div>
<div id="status" class="status">Esperando archivo…</div>
</div>
<script>
const oldParser='function parseOnlineTime(data){if(!data)return NaN;if(Number.isFinite(Number(data.unixtime)))return Number(data.unixtime)*1000;if(data.utc_datetime){const t=Date.parse(data.utc_datetime);if(Number.isFinite(t))return t;}if(data.dateTime){let s=String(data.dateTime);if(!/[zZ]|[+\\-]\\d\\d:?\\d\\d$/.test(s))s+="Z";const t=Date.parse(s);if(Number.isFinite(t))return t;}return NaN;}';
const newParser='function parseOnlineTime(data){if(!data)return NaN;if(Number.isFinite(Number(data.unix_ms)))return Number(data.unix_ms);if(Number.isFinite(Number(data.unix)))return Number(data.unix)*1000;if(Number.isFinite(Number(data.unixtime)))return Number(data.unixtime)*1000;if(data.utc_iso){const t=Date.parse(data.utc_iso);if(Number.isFinite(t))return t;}if(data.utc_rfc3339){const t=Date.parse(data.utc_rfc3339);if(Number.isFinite(t))return t;}if(data.utc_datetime){const t=Date.parse(data.utc_datetime);if(Number.isFinite(t))return t;}if(data.dateTime){let s=String(data.dateTime);if(!/[zZ]|[+\\-]\\d\\d:?\\d\\d$/.test(s))s+="Z";const t=Date.parse(s);if(Number.isFinite(t))return t;}return NaN;}';
const oldSources='const sources=[["TimeAPI","https://timeapi.io/api/Time/current/zone?timeZone=UTC"],["WorldTimeAPI","https://worldtimeapi.org/api/timezone/Etc/UTC"]];';
const newSources='const sources=[["UTCtime.app","https://utctime.app/api/now"],["TimeAPI","https://timeapi.io/api/Time/current/zone?timeZone=UTC"],["WorldTimeAPI","https://worldtimeapi.org/api/timezone/Etc/UTC"]];';
let sourceText='', sourceName='';
const file=document.getElementById('file'),make=document.getElementById('make'),status=document.getElementById('status');
file.addEventListener('change',async()=>{
  const f=file.files&&file.files[0]; if(!f)return;
  sourceName=f.name; sourceText=await f.text();
  const pc=sourceText.split(oldParser).length-1, sc=sourceText.split(oldSources).length-1;
  if(pc<1||sc<1){status.innerHTML='<span class="bad">No se encontró el bloque esperado. No se modificó nada.</span>\nParser encontrados: '+pc+'\nListas de fuentes encontradas: '+sc;make.disabled=true;return;}
  status.innerHTML='<span class="ok">Base reconocida.</span>\nArchivo: '+sourceName+'\nParser encontrados: '+pc+'\nListas de fuentes encontradas: '+sc+'\nListo para generar el index.';
  make.disabled=false;
});
make.addEventListener('click',()=>{
  if(!sourceText)return;
  let patched=sourceText.split(oldParser).join(newParser).split(oldSources).join(newSources);
  if(!patched.includes('https://utctime.app/api/now')||!patched.includes('data.unix_ms')){status.innerHTML='<span class="bad">La verificación final del parche falló.</span>';return;}
  const blob=new Blob([patched],{type:'text/html;charset=utf-8'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='index.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  const pc=patched.split('data.unix_ms').length-1, uc=patched.split('https://utctime.app/api/now').length-1;
  status.innerHTML='<span class="ok">✅ index.html generado correctamente.</span>\nUTCtime.app: '+uc+'\nSoporte unix_ms: '+pc+'\nTimeAPI y WorldTimeAPI se conservaron como respaldo.\nLa lógica de 8 horas no fue modificada.';
});
</script>
</body>
</html>
