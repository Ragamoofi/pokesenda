<!DOCTYPE html>
<html lang="es">

<title>AstraQuest V2 — RPG narrativo con dados</title>
<style>
:root{
  --bg:#080a10; --bg2:#0d1019; --panel:#111522; --panel2:#171d2d; --panel3:#0e1320;

}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;background:

radial-gradient(circle at 90% 8%,rgba(167,113,255,.09),transparent 26%),

.app{display:grid;grid-template-columns:286px minmax(0,1fr) 336px;gap:14px;padding:14px;min-height:100vh}
.col{min-width:0;display:flex;flex-direction:column;gap:14px}.panel{background:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,.012));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;backdrop-filter:blur(12px)}

.brand{display:flex;align-items:center;gap:10px}.sigil{width:36px;height:36px;border:1px solid rgba(244,207,119,.35);border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(244,207,119,.12),rgba(168,137,255,.10));box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}

.btn{border:0;border-radius:12px;padding:10px 12px;font-weight:800;cursor:pointer;background:linear-gradient(180deg,#9bc5ff,#74aaff);color:#101827;box-shadow:0 8px 20px rgba(76,125,220,.24);transition:.16s transform,.16s filter,.16s opacity}.btn:hover{transform:translateY(-1px);filter:brightness(1.04)}.btn:active{transform:none}.btn.secondary{background:linear-gradient(180deg,#b99dff,#9071e8);color:white}.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);box-shadow:none}.btn.gold{background:linear-gradient(180deg,#ffe49d,#efc15a);color:#2b210c}.btn.danger{background:linear-gradient(180deg,#ff95a6,#ed6278);color:white}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none}.btn.sm{padding:7px 9px;font-size:11px}

.dice-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.dice-button{position:relative;min-height:82px;border:1px solid var(--line);background:linear-gradient(180deg,#192135,#111726);border-radius:14px;color:white;cursor:pointer;display:grid;place-items:center;padding:7px;overflow:hidden}.dice-button:hover{border-color:#6689c9}.die-gem{width:38px;height:38px;display:grid;place-items:center;transform-style:preserve-3d;filter:drop-shadow(0 9px 8px rgba(0,0,0,.28));animation:idleDie 4s ease-in-out infinite}.die-gem::before{content:"";position:absolute;inset:2px;background:linear-gradient(145deg,rgba(255,255,255,.28),rgba(141,183,255,.17) 42%,rgba(168,137,255,.18));border:1px solid rgba(255,255,255,.24);clip-path:polygon(50% 0%,90% 21%,100% 68%,73% 100%,27% 100%,0 68%,10% 21%)}.die-gem span{position:relative;z-index:2;font-size:11px;font-weight:900;text-shadow:0 1px 2px #000}.dice-button small{font-size:10px;color:var(--muted)}@keyframes idleDie{0%,100%{transform:rotateX(0) rotateY(0) translateY(0)}50%{transform:rotateX(18deg) rotateY(25deg) translateY(-3px)}}
.roll-stage{position:fixed;inset:0;background:rgba(5,7,12,.76);backdrop-filter:blur(10px);display:grid;place-items:center;z-index:900;padding:18px}.roll-card{width:min(94vw,520px);border:1px solid #34405d;border-radius:26px;background:linear-gradient(180deg,#121827,#0a0e18);padding:24px;text-align:center;box-shadow:0 35px 90px rgba(0,0,0,.55)}.roll-scene{height:210px;display:grid;place-items:center;perspective:900px}.big-die{width:128px;height:128px;display:grid;place-items:center;position:relative;transform-style:preserve-3d;filter:drop-shadow(0 25px 18px rgba(0,0,0,.5))}.big-die::before{content:"";position:absolute;inset:3px;background:linear-gradient(145deg,#dfeaff 0%,#7ea8e9 44%,#6c4dc2 100%);border:2px solid rgba(255,255,255,.58);clip-path:polygon(50% 0%,89% 18%,100% 62%,75% 100%,25% 100%,0 62%,11% 18%);box-shadow:inset 0 0 25px rgba(255,255,255,.35)}.big-die::after{content:"";position:absolute;inset:20px;background:rgba(255,255,255,.08);clip-path:polygon(50% 0%,90% 35%,74% 100%,26% 100%,10% 35%)}.big-die span{position:relative;z-index:3;font-size:34px;font-weight:950;text-shadow:0 2px 5px rgba(0,0,0,.45)}.big-die.rolling{animation:roll3d .9s cubic-bezier(.2,.7,.25,1) both}@keyframes roll3d{0%{transform:rotateX(0) rotateY(0) scale(.86)}22%{transform:rotateX(220deg) rotateY(120deg) scale(1.08) translateY(-12px)}55%{transform:rotateX(520deg) rotateY(410deg) scale(.97) translateY(8px)}100%{transform:rotateX(720deg) rotateY(720deg) scale(1)}}.roll-result{font-size:44px;font-weight:950;line-height:1}.roll-caption{margin-top:7px;color:var(--muted);font-size:12px}
.combat-banner{display:grid;grid-template-columns:1fr 1fr;gap:8px}.combat-side{padding:10px;border-radius:13px;border:1px solid var(--line);background:var(--panel2)}.enemy-state{font-size:11px;color:var(--red)}
.hr{height:1px;background:var(--line);margin:13px 0}.field{width:100%;border:1px solid var(--line);background:#0c101a;color:var(--text);border-radius:12px;padding:10px 11px;outline:none}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.form-col{display:grid;gap:10px}label{font-size:11px;color:var(--muted);display:block;margin-bottom:5px}.textarea-lg{min-height:130px;resize:vertical}
.modalback{position:fixed;inset:0;background:rgba(4,6,10,.74);backdrop-filter:blur(10px);display:grid;place-items:center;padding:16px;z-index:700}.modal{width:min(980px,96vw);max-height:92vh;overflow:auto;border-radius:24px;border:1px solid #303b56;background:linear-gradient(180deg,#101522,#0b0f18);box-shadow:0 40px 100px rgba(0,0,0,.55)}.modal-top{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line)}.modal-body{padding:18px}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.hero-box{border:1px solid var(--line);background:linear-gradient(180deg,rgba(141,183,255,.08),rgba(168,137,255,.04));border-radius:18px;padding:17px}.hero h1{font-size:32px;line-height:1.05;margin:0 0 8px}.saveitem{border:1px solid var(--line);background:var(--panel2);border-radius:15px;padding:12px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.save-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.footer-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:16px}
.tension{height:6px;background:#20283a;border-radius:99px;overflow:hidden}.tension>span{display:block;height:100%;background:linear-gradient(90deg,#6d92d4,#cf5f7c);transition:width .25s}.note{border-left:3px solid rgba(244,207,119,.55);padding:9px 11px;background:rgba(244,207,119,.04);color:#d7c99f;font-size:11px;line-height:1.45;border-radius:0 9px 9px 0}
.ai-box{display:grid;gap:9px}.ai-row{display:flex;align-items:center;justify-content:space-between;gap:10px}.ai-state{display:flex;align-items:center;gap:8px;font-size:12px}.ai-dot{width:9px;height:9px;border-radius:50%;background:#7d879a;box-shadow:0 0 0 3px rgba(125,135,154,.10)}.ai-dot.ready{background:var(--green);box-shadow:0 0 0 3px rgba(111,214,164,.12)}.ai-dot.loading{background:var(--gold);box-shadow:0 0 0 3px rgba(244,207,119,.12);animation:pulseAI 1.1s ease-in-out infinite}.ai-dot.error{background:var(--red);box-shadow:0 0 0 3px rgba(255,115,136,.12)}.ai-progress{font-size:10px;line-height:1.35;color:var(--muted);word-break:break-word}.ai-models{display:grid;grid-template-columns:1fr;gap:7px}.ai-model{border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:8px 9px;color:var(--text);width:100%}.thinking{display:inline-flex;gap:4px;align-items:center}.thinking i{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.35;animation:thinkDot 1s infinite}.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}@keyframes pulseAI{50%{opacity:.45;transform:scale(.82)}}@keyframes thinkDot{0%,70%,100%{transform:translateY(0);opacity:.3}35%{transform:translateY(-3px);opacity:1}}
@media(max-width:1120px){.app{grid-template-columns:1fr}.main{order:-1}.story-panel{min-height:72vh}.left,.right{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.left>.panel:last-child{display:none}}
@media(max-width:720px){.app{padding:8px;gap:8px}.left,.right{display:flex}.story-head{flex-direction:column}.story-actions{justify-content:flex-start}.compose-row{grid-template-columns:1fr}.msg{max-width:100%}.dice-grid{grid-template-columns:repeat(2,1fr)}.form-grid,.hero{grid-template-columns:1fr}.modal-body{padding:13px}.hero h1{font-size:26px}.saveitem{flex-direction:column}.save-actions{justify-content:flex-start}.roll-card{padding:18px}.big-die{width:112px;height:112px}}

<div id="app"></div>
<script>
(()=>{
'use strict';
const K='astraquest_v2_saves', A='astraquest_v2_active';
const el=document.getElementById('app');
const ui={tab:'guide',modal:true,modalMode:'home',rolling:false,rollPreview:null};
let game=null;
const AI_MODE_KEY='astraquest_v2_ai_model';
const AI_MODELS={
 lite:{id:'Llama-3.2-1B-Instruct-q4f16_1-MLC',name:'Ligera · Llama 3.2 1B',hint:'Menor descarga y menor uso de memoria. Recomendado para equipos modestos.'},
 balanced:{id:'Hermes-3-Llama-3.2-3B-q4f16_1-MLC',name:'Equilibrada · Hermes 3 3B',hint:'Recomendada. Mejor imaginación y continuidad, con ~2.3 GB de VRAM.'},
 quality:{id:'Hermes-3-Llama-3.1-8B-q4f16_1-MLC',name:'Calidad · Hermes 3 8B',hint:'Narración bastante mejor. Requiere cerca de 4.9 GB de VRAM y una descarga mayor.'}
};
const ai={engine:null,webllm:null,loading:false,ready:false,busy:false,error:'',progress:'IA local aún no cargada.',mode:localStorage.getItem(AI_MODE_KEY)||'balanced',promise:null};
const ABILS=['STR','DEX','CON','INT','WIS','CHA'];
const SKILLS={
  Atletismo:'STR',Acrobacias:'DEX',Sigilo:'DEX',Juego_de_manos:'DEX',Investigación:'INT',Arcanos:'INT',Historia:'INT',Naturaleza:'INT',Religión:'INT',Percepción:'WIS',Perspicacia:'WIS',Supervivencia:'WIS',Medicina:'WIS',Trato_con_animales:'WIS',Persuasión:'CHA',Engaño:'CHA',Intimidación:'CHA',Interpretación:'CHA'
};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36);
const now=()=>new Date().toISOString();
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const mod=n=>Math.floor((Number(n)-10)/2);
const fmt=n=>n>=0?`+${n}`:`${n}`;
const rand=n=>{const u=new Uint32Array(1);crypto.getRandomValues(u);return u[0]%n};
const die=n=>rand(n)+1;
const pick=a=>a[rand(a.length)];
function rolls(expr){const m=String(expr).toLowerCase().replace(/\s/g,'').match(/^(\d+)d(\d+)([+-]\d+)?$/);if(!m)throw Error('dice');const c=+m[1],s=+m[2],bonus=+(m[3]||0);if(c<1||c>30||s<2||s>1000)throw Error('dice');const r=Array.from({length:c},()=>die(s));return{expr:`${c}d${s}${bonus?bonus>0?`+${bonus}`:bonus:''}`,rolls:r,modifier:bonus,total:r.reduce((a,b)=>a+b,0)+bonus}}
function d20(bonus=0,mode='normal'){const a=die(20),b=mode==='normal'?null:die(20);let natural=a;if(mode==='advantage')natural=Math.max(a,b);if(mode==='disadvantage')natural=Math.min(a,b);return{a,b,natural,modifier:bonus,total:natural+bonus,mode}}
function saves(){try{return JSON.parse(localStorage.getItem(K)||'[]')}catch{return[]}}
function persist(){if(!game)return;game.updatedAt=now();const all=saves();const i=all.findIndex(x=>x.id===game.id);const copy=structuredClone(game);if(i>=0)all[i]=copy;else all.unshift(copy);localStorage.setItem(K,JSON.stringify(all));localStorage.setItem(A,game.id)}
function add(role,text,meta={}){game.chat.push({id:uid(),role,text,meta,at:now()});if(game.chat.length>240)game.chat=game.chat.slice(-220)}
function sys(t){add('system',t)}function gm(t,m={}){add('gm',t,m)}function usr(t){add('user',t)}function rollmsg(t){add('roll',t)}
function character(data){const c={name:data.name||'Aventurero',ancestry:data.ancestry||'Humano',className:data.className||'Explorador',background:data.background||'Forastero',level:1,xp:0,proficiency:2,maxHp:+data.maxHp||14,hp:+data.maxHp||14,ac:+data.ac||13,speed:30,gold:+data.gold||15,attrs:{STR:+data.STR||12,DEX:+data.DEX||12,CON:+data.CON||12,INT:+data.INT||12,WIS:+data.WIS||12,CHA:+data.CHA||12},inventory:[{id:uid(),name:'Mochila',qty:1},{id:uid(),name:'Raciones',qty:2},{id:uid(),name:'Cuerda',qty:1},{id:uid(),name:'Antorcha',qty:2},{id:uid(),name:'Arma de viaje',qty:1}],conditions:[],deathFails:0,deathSuccess:0};return c}
function newGame(form,char){const g={id:uid(),title:form.title||'Campaña sin nombre',premise:form.premise||'Una aventura comienza.',genre:form.genre||'Fantasía',tone:form.tone||'Aventura',difficulty:form.difficulty||'Normal',createdAt:now(),updatedAt:now(),status:'exploration',world:{time:'Día 1 · Mañana',day:1,phase:0,currentLocation:'Umbral de la aventura',weather:'Incierto',tension:18},character:character(char),chat:[],pending:null,combat:null,quests:[],npcs:[],clues:[],locations:[],flags:{},memory:{summary:[],important:[],recent:[]},turn:0};game=g;bootstrapCampaign();persist()}
function bootstrapCampaign(){const g=game;const generated=campaignSeed(g.premise,g.genre,g.tone);g.world.currentLocation=generated.location;g.world.weather=generated.weather;g.quests.push({id:uid(),title:generated.quest,desc:generated.questDesc,status:'Activa'});g.npcs.push(...generated.npcs);g.locations.push({id:uid(),name:generated.location,known:true});sys('Campaña creada. El motor de reglas controla dados, HP y combate. Puedes activar la IA local gratuita para que actúe como Dungeon Master; si no está disponible, entra el narrador local de respaldo.');gm(`**${g.title}**\n\n${g.premise}\n\n${generated.opening}\n\nTú eres **${g.character.name}**, ${g.character.ancestry.toLowerCase()} ${g.character.className.toLowerCase()} con pasado de ${g.character.background.toLowerCase()}.\n\n${generated.hook}\n\n**¿Qué haces?**`,{scene:true});remember(generated.hook)}
function campaignSeed(premise,genre,tone){const p=premise.toLowerCase();let location='Camino fronterizo',weather='Nublado',opening='El mundo parece sostener la respiración mientras das tu primer paso.',hook='Algo cercano rompe la normalidad: un sonido, una mirada o una ausencia demasiado evidente.',quest='Entender qué está ocurriendo',questDesc='Sigue las primeras señales y decide en quién confiar.',npcs=[npc('Mara Venn','Desconocida cautelosa','neutral')];
 if(/santiago|chile|detective|polic/i.test(p)){location='Santiago de Chile';weather='Noche húmeda';opening='Las luces de la ciudad se reflejan sobre el pavimento mojado. Micros, motores y letreros de neón forman un ruido constante que no alcanza a tapar la sensación de que algo está fuera de lugar.';hook='A pocas cuadras, una llamada incompleta y una dirección escrita a mano son lo único que conecta una desaparición reciente con rumores que nadie quiere repetir.';quest='Seguir la primera pista';questDesc='Investiga la desaparición sin revelar demasiado pronto lo que sabes.';npcs=[npc('Camila Rojas','Testigo nerviosa','wary'),npc('Sergio Mena','Conserje del sector','neutral')];}
 else if(/pirat|mar|barco/i.test(p)){location='Puerto de Bruma';weather='Viento salino';opening='Mástiles oscuros se balancean contra un cielo cargado. La marea golpea los pilotes y los marineros hablan en voz baja de luces que se mueven debajo del agua.';hook='Un capitán desapareció dejando atrás un mapa incompleto y una deuda que varios hombres armados quieren cobrar.';quest='Encontrar el mapa perdido';questDesc='Descubre quién tiene la parte faltante del mapa antes de que lo hagan tus rivales.';npcs=[npc('Iria Sal','Cartógrafa cansada','neutral'),npc('Rusk','Contrabandista sonriente','wary')];}
 else if(/post|apocal|zombi|radi/i.test(p)){location='Sector 9 en ruinas';weather='Viento con polvo';opening='El viento arrastra ceniza entre autos oxidados y edificios abiertos como esqueletos. Cada sonido viaja demasiado lejos.';hook='Una señal de radio repite tres palabras y unas coordenadas. Nadie del refugio reconoce la voz.';quest='Rastrear la señal';questDesc='Decide si la señal es una oportunidad, una trampa o ambas.';npcs=[npc('Lena','Mecánica del refugio','friendly'),npc('Varko','Explorador desconfiado','wary')];}
 else if(/terror|horror|sobrenatural/i.test(p)){location='Pueblo de Valdoren';weather='Lluvia fina';opening='Las ventanas permanecen cerradas pese a que todavía no es tarde. La lluvia cae con una regularidad casi mecánica y nadie se queda demasiado tiempo en la calle.';hook='En la plaza hay una fotografía clavada a un árbol. Reconoces a alguien que viste hace pocos minutos, pero la foto tiene fecha de hace treinta años.';quest='Descifrar la fotografía';questDesc='Averigua quién aparece en la imagen y por qué la gente evita hablar del tema.';npcs=[npc('Elena Var','Tabernera reservada','wary'),npc('Padre Orsen','Anciano vigilante','neutral')];}
 else if(/fantas|medieval|mercenario|reino|drag/i.test(p)){location='Posada del Cuervo Gris';weather='Tormenta lejana';opening='La madera cruje bajo ráfagas que anuncian tormenta. Dentro de la posada, el fuego arde fuerte pero casi nadie conversa.';hook='Una silla permanece vacía junto a una mesa con comida aún caliente. Nadie parece dispuesto a explicar quién estaba sentado allí.';quest='Descubrir quién falta';questDesc='Pregunta, observa y decide cuánto quieres involucrarte en la desaparición.';npcs=[npc('Neris','Posadera observadora','neutral'),npc('Halen','Mercenario taciturno','wary')];}
 return{location,weather,opening,hook,quest,questDesc,npcs}}
function npc(name,role,attitude='neutral'){return{id:uid(),name,role,attitude,trust:attitude==='friendly'?2:attitude==='wary'?-1:0,alive:true,notes:[]}}
function aiModel(){return AI_MODELS[ai.mode]||AI_MODELS.balanced}
function aiStateLabel(){if(ai.error)return'Error';if(ai.ready)return ai.busy?'Narrando…':'Lista';if(ai.loading)return'Descargando / cargando';return'No iniciada'}
function aiDotClass(){return ai.error?'error':ai.ready?'ready':ai.loading?'loading':''}
function paintAIStatus(){const x=document.getElementById('aiStatusLive');if(x)x.innerHTML=aiStatusInner()}
function aiStatusInner(){const m=aiModel();return `<div class="ai-box"><div class="ai-row"><div class="ai-state"><span class="ai-dot ${aiDotClass()}"></span><b>${esc(aiStateLabel())}</b></div><span class="chip ${ai.ready?'good':ai.error?'bad':'gold'}">Sin API</span></div><div class="ai-progress">${esc(ai.progress)}</div><div class="ai-models"><select class="ai-model" onchange="AQ.aiModel(this.value)" ${ai.loading||ai.ready||ai.busy?'disabled':''}>${Object.entries(AI_MODELS).map(([k,v])=>`<option value="${k}" ${ai.mode===k?'selected':''}>${esc(v.name)}</option>`).join('')}</select><div class="small">${esc(m.hint)}</div></div><div class="footer-actions" style="margin-top:2px;justify-content:flex-start"><button class="btn sm ${ai.ready?'ghost':'gold'}" onclick="AQ.aiStart()" ${ai.loading||ai.ready?'disabled':''}>${ai.ready?'IA preparada':ai.loading?'Cargando…':'Activar IA local'}</button></div>${ai.error?`<div class="note">${esc(ai.error)} El juego seguirá usando su narrador local como respaldo.</div>`:''}</div>`}
async function ensureLocalAI(){
 if(ai.ready&&ai.engine)return true;
 if(ai.promise)return ai.promise;
 if(!('gpu' in navigator)){ai.error='Este navegador no expone WebGPU. Prueba una versión reciente de Chrome/Edge o usa el narrador local.';ai.progress='WebGPU no disponible.';paintAIStatus();return false}
 ai.loading=true;ai.error='';ai.progress='Preparando el motor de IA local…';paintAIStatus();
 ai.promise=(async()=>{try{
   const webllm=await import('https://esm.run/@mlc-ai/web-llm@0.2.85');ai.webllm=webllm;
   const model=aiModel();
   const appConfig={...webllm.prebuiltAppConfig,cacheBackend:'cache'};
   ai.engine=await webllm.CreateMLCEngine(model.id,{appConfig,initProgressCallback:r=>{ai.progress=r?.text||'Cargando modelo…';paintAIStatus()},logLevel:'WARN'});
   ai.ready=true;ai.loading=false;ai.progress=`${model.name} lista. La narración se genera en este dispositivo.`;paintAIStatus();return true
 }catch(err){console.error('AstraQuest WebLLM:',err);ai.engine=null;ai.ready=false;ai.loading=false;ai.error='No se pudo iniciar la IA local: '+(err?.message||String(err));ai.progress='Se mantiene el Dungeon Master local de respaldo.';paintAIStatus();return false}finally{ai.promise=null}})();
 return ai.promise
}
function compactAIContext(){if(!game)return'';const c=game.character;return `CAMPAÑA: ${game.title}\nPREMISA: ${game.premise}\nGÉNERO/TONO: ${game.genre} / ${game.tone}\nDIFICULTAD: ${game.difficulty}\nPERSONAJE: ${c.name}; ${c.ancestry}; ${c.className}; ${c.background}; nivel ${c.level}; HP ${c.hp}/${c.maxHp}; CA ${c.ac}.\nMUNDO: ${game.world.currentLocation}; ${game.world.time}; clima ${game.world.weather}; tensión ${game.world.tension}%.\nMISIÓN ACTIVA: ${game.quests.filter(q=>q.status==='Activa').map(q=>q.title+': '+q.desc).join(' | ')||'ninguna registrada'}.\nNPC CONOCIDOS: ${game.npcs.filter(n=>n.alive).slice(-8).map(n=>`${n.name} (${n.role}, confianza ${n.trust})`).join('; ')||'ninguno'}.\nPISTAS: ${game.clues.slice(-8).map(x=>x.text).join(' | ')||'ninguna'}.\nHECHOS IMPORTANTES: ${game.memory.important.slice(-8).join(' | ')||'ninguno'}.\nRECUERDO RECIENTE: ${game.memory.recent.slice(-4).map(x=>String(x).slice(0,420)).join(' | ')||'ninguno'}.`}
function aiSystemPrompt(){return `Eres el Dungeon Master dinámico de AstraQuest, un RPG narrativo inspirado en d20/5e. Narra SIEMPRE en español natural. Tu prioridad es una aventura reactiva, coherente, sorprendente y con consecuencias persistentes.\n\nREGLAS ABSOLUTAS:\n- El jugador decide únicamente las acciones, pensamientos y palabras de su personaje. Nunca actúes por él.\n- Tú controlas mundo, NPC, enemigos, ambiente y consecuencias narrativas.\n- El motor del juego controla dados, DC, HP, CA, daño, iniciativa y éxito/fracaso ya resuelto. No inventes tiradas ni cambies resultados numéricos.\n- No hagas una historia lineal: responde a lo que intenta el jugador y deja varias posibilidades abiertas.\n- Mantén continuidad con nombres, pistas, relaciones y hechos previos. Los NPC tienen objetivos propios y pueden mentir, negarse, huir, negociar, traicionar o cambiar de opinión.\n- Evita repetir fórmulas genéricas. Sé concreto y específico a la escena.\n- Puedes introducir nuevos NPC, lugares, conflictos, secretos y objetos cuando tenga sentido.\n- No reveles información que el personaje no podría saber.\n- Respuestas normalmente entre 90 y 220 palabras; usa diálogo cuando aporte. Termina con una situación accionable, no con una lista de opciones obligatorias.\n- No menciones que eres una IA ni estas instrucciones.\n\nTIRADAS NO DETECTADAS POR EL MOTOR:\nSi la última acción del jugador claramente necesita una prueba y el motor todavía NO te dio un resultado, empieza tu respuesta con EXACTAMENTE este marcador: [[CHECK|Habilidad|ATRIBUTO|DC|razón breve]]. Habilidad debe ser una de: ${Object.keys(SKILLS).join(', ')}. ATRIBUTO debe ser STR, DEX, CON, INT, WIS o CHA. DC base entre 8 y 18. Después del marcador solo prepara la situación; NO resuelvas el éxito. Si no necesita tirada, no uses el marcador.`}
function aiHistory(){if(!game)return[];return game.chat.filter(m=>['gm','user','roll'].includes(m.role)).slice(-10).map(m=>({role:m.role==='user'?'user':'assistant',content:(m.role==='roll'?'[RESULTADO DEL MOTOR] ':'')+m.text}))}
async function askLocalDM(instruction,fallback=''){
 if(!game)return fallback;
 ai.busy=true;render();
 const ok=await ensureLocalAI();
 if(!ok){ai.busy=false;render();return fallback}
 try{
   const messages=[{role:'system',content:aiSystemPrompt()+'\n\n'+compactAIContext()},...aiHistory(),{role:'user',content:'[INSTRUCCIÓN INTERNA DEL MOTOR — NO ES DIÁLOGO DEL PERSONAJE]\n'+instruction}];
   const reply=await ai.engine.chat.completions.create({messages,temperature:.92,top_p:.95,max_tokens:360,frequency_penalty:.12,presence_penalty:.12});
   const text=reply?.choices?.[0]?.message?.content?.trim();
   if(text)remember(text.slice(0,700));
   return text||fallback
 }catch(err){console.error('AstraQuest narración IA:',err);ai.error='La IA local falló en este turno: '+(err?.message||String(err));ai.progress='Puedes seguir jugando; usaré el narrador local cuando haga falta.';return fallback
 }finally{ai.busy=false;paintAIStatus()}
}
function parseAICheck(text){const m=String(text||'').match(/\[\[CHECK\|([^|\]]+)\|([A-Z]{3})\|(\d{1,2})\|([^\]]+)\]\]/i);if(!m)return null;const requested=m[1].trim();const skill=Object.keys(SKILLS).find(k=>k.toLowerCase()===requested.toLowerCase());const ability=m[2].toUpperCase();if(!skill||!ABILS.includes(ability))return null;return{skill,ability,dc:clamp(+m[3]||12,8,18),reason:m[4].trim(),clean:String(text).replace(m[0],'').trim()}}
function remember(t,important=false){game.memory.recent.push(t);if(game.memory.recent.length>12)game.memory.recent.shift();if(important){game.memory.important.push(t);if(game.memory.important.length>24)game.memory.important.shift()}}
function classify(text){const t=text.toLowerCase();if(/inventario|mis cosas|mochila/.test(t))return{kind:'inventory'};if(/descanso|dormir|reposo|me siento a descansar/.test(t))return{kind:'rest'};if(/ataco|golpeo|disparo|apuñalo|lanzo.*contra|peleo|combato/.test(t))return{kind:'attack'};if(/huir|escapo|escapar|retrocedo corriendo/.test(t))return{kind:'escape'};if(/hablo|pregunto|digo|converso|saludo/.test(t))return{kind:'talk'};if(/convenzo|persuad|negocio/.test(t))return{kind:'check',skill:'Persuasión',ability:'CHA',dc:13};if(/miento|engaño|engañ/.test(t))return{kind:'check',skill:'Engaño',ability:'CHA',dc:14};if(/amenazo|intimido|intimid/.test(t))return{kind:'check',skill:'Intimidación',ability:'CHA',dc:14};if(/sigilo|escond|escabul|sin hacer ruido/.test(t))return{kind:'check',skill:'Sigilo',ability:'DEX',dc:13};if(/cerradura|ganzúa|robar|bolsillo|desarmo la trampa/.test(t))return{kind:'check',skill:'Juego de manos',ability:'DEX',dc:14};if(/trepo|salto|empujo|rompo|fuerzo|levanto/.test(t))return{kind:'check',skill:'Atletismo',ability:'STR',dc:13};if(/observo|miro alrededor|escucho|percibo|vigilo/.test(t))return{kind:'check',skill:'Percepción',ability:'WIS',dc:12};if(/investigo|busco pistas|examino|inspecciono|analizo/.test(t))return{kind:'check',skill:'Investigación',ability:'INT',dc:13};if(/rastreo|superviv|huellas|orientarme/.test(t))return{kind:'check',skill:'Supervivencia',ability:'WIS',dc:13};if(/entro|avanzo|voy hacia|camino|me acerco|salgo/.test(t))return{kind:'travel'};return{kind:'free'}}
function skillBonus(skill,ability){const proficient=['Percepción','Supervivencia','Atletismo'].includes(skill);return mod(game.character.attrs[ability])+(proficient?game.character.proficiency:0)}
async function submit(text){text=text.trim();if(!game||!text||game.pending||game.status==='defeat'||ai.busy)return;usr(text);game.turn++;game.lastAction=text;const a=classify(text);render();if(game.combat){if(a.kind==='attack')return combatAttackRequest();if(a.kind==='escape')return checkRequest('Acrobacias','DEX',13,'Intentas romper el contacto y escapar.', 'escape');if(a.kind!=='inventory'){gm(`Estás en combate con **${game.combat.enemy.name}**. Puedes atacar, intentar huir o describir otra acción de combate.`);persist();render();return}}
 if(a.kind==='inventory'){gm(inventoryText());}
 else if(a.kind==='rest'){handleRest();}
 else if(a.kind==='attack'){startCombat();}
 else if(a.kind==='check'){checkRequest(a.skill,a.ability,adjustDC(a.dc),`La acción tiene incertidumbre y consecuencias.`, 'ability');}
 else if(a.kind==='talk'){await handleTalk(text);}
 else if(a.kind==='travel'){await handleTravel(text);}
 else await handleFree(text);
 advanceTime();persist();render()}
function adjustDC(dc){if(game.difficulty==='Difícil')return dc+2;if(game.difficulty==='Letal')return dc+3;return dc}
function checkRequest(skill,ability,dc,reason,kind='ability'){const bonus=skillBonus(skill,ability);game.pending={kind,skill,ability,dc,modifier:bonus,reason};gm(`**Prueba requerida**\n\n${skill} · ${ability}\n**DC ${dc}** · Modificador **${fmt(bonus)}**\n\n${reason}\n\nLa historia no avanza hasta resolver la tirada.`);ui.tab='dice';persist();render()}
function resolvePending(mode='normal'){if(!game?.pending)return;const p=game.pending;const r=d20(p.modifier,mode);animateRoll(20,r.natural,async()=>{rollmsg(`${p.skill}: ${mode!=='normal'?`[${r.a}, ${r.b}] → `:''}**${r.natural}** ${fmt(r.modifier)} = **${r.total}** · DC ${p.dc}`);game.pending=null;if(p.kind==='combat_attack')resolvePlayerHit(r,p);else if(p.kind==='escape')resolveEscape(r,p);else await resolveCheck(r,p);advanceTime();persist();render()})}
async function resolveCheck(r,p){const success=r.natural===20||r.total>=p.dc;const critFail=r.natural===1;let fallback='';if(success){const bonus=r.natural===20?' además de una ventaja inesperada':'';fallback=successNarrative(p.skill)+bonus+'.';applySuccess(p.skill,r.natural===20);game.world.tension=clamp(game.world.tension-2,0,100)}else{fallback=failureNarrative(p.skill,critFail);applyFailure(p.skill,critFail);game.world.tension=clamp(game.world.tension+(critFail?9:4),0,100)}const outcome=success?(r.natural===20?'ÉXITO CRÍTICO':'ÉXITO'):(critFail?'FRACASO CRÍTICO':'FRACASO');const narration=await askLocalDM(`Narra la consecuencia inmediata de la última acción del jugador. El motor ya resolvió la prueba: ${p.skill} (${p.ability}), resultado natural ${r.natural}, total ${r.total} contra DC ${p.dc}: ${outcome}. Debes respetar ese resultado. No pidas otra tirada para la misma acción.`,fallback);gm(narration)}
function successNarrative(skill){const n={Percepción:'Te detienes lo suficiente para separar lo importante del ruido. Encuentras un detalle que cambia la lectura de la escena',Investigación:'Conectas dos detalles que parecían independientes y obtienes una pista concreta',Persuasión:'Tu argumento encuentra el punto débil correcto. La otra persona cede más de lo que pretendía',Engaño:'La mentira encaja con suficiente naturalidad para pasar el primer filtro',Intimidación:'La presión funciona. La otra persona intenta mantener la compostura, pero retrocede',Sigilo:'Te mueves aprovechando sombras, ruido ambiente y momentos muertos. Nadie reacciona',Atletismo:'La maniobra exige esfuerzo, pero la completas con control',Supervivencia:'Lees el terreno con claridad y encuentras señales que otros pasarían por alto','Juego de manos':'Tus movimientos son precisos y discretos'};return n[skill]||'La acción resulta a tu favor y abre una nueva posibilidad'}
function failureNarrative(skill,crit){const n={Percepción:'Miras demasiado tiempo el detalle equivocado. Algo importante queda fuera de tu atención',Investigación:'Las piezas no encajan todavía. Peor aún, el tiempo invertido permite que la situación cambie',Persuasión:'Tu interlocutor escucha, pero detecta la intención detrás de tus palabras y se cierra',Engaño:'Hay una inconsistencia en lo que dices. No basta para descubrir toda la verdad, pero sí para sembrar sospecha',Intimidación:'La amenaza no produce miedo; produce resistencia',Sigilo:'Un ruido seco traiciona tu movimiento y obliga a reaccionar antes de lo previsto',Atletismo:'La maniobra falla a mitad de camino y te deja en una posición peor',Supervivencia:'Interpretas mal una señal y pierdes tiempo','Juego de manos':'Algo se mueve, cae o hace ruido en el peor momento'};return (crit?'**Fracaso crítico.** ':'')+(n[skill]||'La acción falla y deja una complicación real')+'.'}
function applySuccess(skill,critical){if(['Percepción','Investigación','Supervivencia'].includes(skill)){const clues=cluePool().filter(c=>!game.clues.some(x=>x.text===c));if(clues.length){const c=pick(clues);game.clues.push({id:uid(),text:c});remember(c,true);gm(`**Pista obtenida:** ${c}`)}}if(['Persuasión','Engaño','Intimidación'].includes(skill)&&game.npcs.length){game.npcs[0].trust+=critical?2:1}}
function applyFailure(skill,crit){if(crit&&['Atletismo','Sigilo','Juego de manos'].includes(skill)){const dmg=die(4);game.character.hp=clamp(game.character.hp-dmg,0,game.character.maxHp);rollmsg(`Complicación: recibes **${dmg} HP** de daño.`);if(game.character.hp<=0)defeat('La complicación te deja fuera de combate.')}}
function cluePool(){const loc=game.world.currentLocation;return[`Alguien dejó una marca reciente cerca de ${loc}.`,`Una frase escuchada antes coincide con un detalle del entorno.`,`Hay huellas de que una tercera persona estuvo aquí poco antes de tu llegada.`,`Un objeto aparentemente común fue movido hace muy poco.`,`La versión más obvia de los hechos no explica una pequeña contradicción que acabas de notar.`]}
async function handleTalk(text){const alive=game.npcs.filter(n=>n.alive);const named=alive.find(n=>text.toLowerCase().includes(n.name.toLowerCase()));const n=named||alive[0];const fallback=!n?'No hay nadie cerca dispuesto a conversar. El silencio, por ahora, es tu única respuesta.':`**${n.name}** te escucha con cautela y responde sin regalar más información de la necesaria.`;const narration=await askLocalDM(`El jugador intenta conversar: “${text}”. Interpreta a los NPC presentes con personalidad, objetivos e información limitada. Si menciona a un NPC conocido, priorízalo. No decidas lo que dice el personaje del jugador más allá de sus palabras escritas.`,fallback);gm(narration);if(n)remember(`Conversaste con ${n.name}.`)}
async function handleTravel(text){const options=travelPool();const next=pick(options.filter(x=>x!==game.world.currentLocation));game.world.currentLocation=next;if(!game.locations.some(l=>l.name===next))game.locations.push({id:uid(),name:next,known:true});const fallback=`Llegas a **${next}**. El lugar presenta nuevas rutas, personas y riesgos que no estaban disponibles en la escena anterior.`;const narration=await askLocalDM(`El jugador se desplaza o intenta avanzar: “${text}”. El motor ha fijado el nuevo lugar como “${next}”. Describe la transición y la llegada de forma concreta, conectándola con la campaña y sus pistas. No cambies el nombre del lugar fijado por el motor.`,fallback);gm(narration);remember(`Llegaste a ${next}.`)}
function travelPool(){const g=game.genre.toLowerCase();if(/detective|terror/.test(g))return['Calle lateral','Edificio antiguo','Café casi vacío','Estacionamiento subterráneo','Plaza silenciosa'];if(/pirat/.test(g))return['Muelle viejo','Taberna del Ancla','Mercado del puerto','Cubierta de un navío','Almacén costero'];if(/post/.test(g))return['Refugio improvisado','Avenida derrumbada','Taller abandonado','Estación de servicio','Túnel de mantenimiento'];return['Posada','Bosque cercano','Camino de piedra','Ruinas antiguas','Puesto de guardia','Mercado local']}
async function handleFree(text){const t=text.toLowerCase();if(/puerta|cofre|caja cerrada/.test(t)){checkRequest('Juego de manos','DEX',adjustDC(14),'Intentas manipular algo cerrado sin garantías de éxito.');return}if(/magia|hechizo|ritual/.test(t)){checkRequest('Arcanos','INT',adjustDC(14),'Intentas comprender o controlar fuerzas que no obedecen automáticamente.');return}const fallback=pick([`Tu decisión modifica la escena y el mundo responde con una consecuencia concreta.`,`Consigues realizar la parte razonable de tu acción; la escena cambia a partir de ella.`,`La acción no exige una tirada inmediata y abre una nueva posibilidad en la escena.`]);const narration=await askLocalDM(`Responde a la última acción libre del jugador: “${text}”. Si requiere una prueba que el clasificador no detectó, usa el marcador CHECK indicado en tus reglas. Si no, narra el resultado razonable y la reacción del mundo.`,fallback);const req=parseAICheck(narration);if(req){if(req.clean)gm(req.clean);checkRequest(req.skill,req.ability,adjustDC(req.dc),req.reason,'ability');return}gm(narration)}
function handleRest(){if(game.combat){gm('No puedes descansar mientras alguien intenta matarte.');return}const heal=Math.max(1,die(6)+mod(game.character.attrs.CON));game.character.hp=clamp(game.character.hp+heal,0,game.character.maxHp);gm(`Encuentras un momento de calma suficiente para recuperar fuerzas. Recuperas **${heal} HP** y quedas en **${game.character.hp}/${game.character.maxHp} HP**.`);game.world.tension=clamp(game.world.tension-5,0,100)}
function inventoryText(){return `Revisas tus pertenencias.\n\n${game.character.inventory.map(i=>`• ${i.name}${i.qty>1?` ×${i.qty}`:''}`).join('\n')}\n\nDinero: **${game.character.gold}**.`}
function startCombat(){if(game.combat)return;const e=enemyForGenre();const pInit=die(20)+mod(game.character.attrs.DEX),eInit=die(20)+e.init;game.combat={round:1,turn:pInit>=eInit?'player':'enemy',enemy:e,initiative:{player:pInit,enemy:eInit}};game.status='combat';sys('¡Combate iniciado!');rollmsg(`Iniciativa · ${game.character.name}: **${pInit}** · ${e.name}: **${eInit}**`);gm(`**${e.name}** entra en combate. ${e.desc}\n\n${game.combat.turn==='player'?'Actúas primero.':'Tu enemigo se mueve primero.'}`);if(game.combat.turn==='enemy')setTimeout(()=>{if(game?.combat)enemyTurn()},100)}
function enemyForGenre(){const g=game.genre.toLowerCase();const pools=/post/.test(g)?[['Saqueador',12,12,2,'Un superviviente armado que decidió que eres un problema.'],['Mutado hambriento',15,11,1,'Se mueve con impulsos rápidos y poco humanos.']]:/pirat/.test(g)?[['Marinero hostil',13,12,2,'Desenvaina un sable corto con demasiada práctica.'],['Contrabandista armado',11,13,2,'Busca cobertura y calcula la distancia.']]:/detective|terror/.test(g)?[['Desconocido encapuchado',12,12,2,'No dice una palabra; simplemente cierra la distancia.'],['Criatura de sombra',14,13,3,'Su silueta no termina de encajar con la luz del lugar.']]:[['Bandido',13,12,2,'Levanta su arma y te mide de arriba abajo.'],['Cultista',11,13,2,'Murmura algo entre dientes mientras adopta una postura agresiva.'],['Bestia salvaje',15,11,3,'Gruñe y baja el centro de gravedad, lista para lanzarse.']];const p=pick(pools);return{name:p[0],hp:p[1],maxHp:p[1],ac:p[2],attack:p[3],init:1,damage:'1d6+1',desc:p[4]}}
function combatAttackRequest(){const ability=game.character.attrs.DEX>game.character.attrs.STR?'DEX':'STR';const bonus=mod(game.character.attrs[ability])+game.character.proficiency;game.pending={kind:'combat_attack',skill:'Ataque',ability,dc:game.combat.enemy.ac,modifier:bonus,reason:'Tirada de ataque'};gm(`Preparas tu ataque contra **${game.combat.enemy.name}**. Debes superar **CA ${game.combat.enemy.ac}**.`);ui.tab='dice';persist();render()}
function resolvePlayerHit(r,p){const e=game.combat?.enemy;if(!e)return;const hit=r.natural===20||r.total>=e.ac;if(hit){const base=rolls(r.natural===20?'2d8':'1d8');const abilityBonus=mod(game.character.attrs[p.ability]);const dmg=Math.max(1,base.total+abilityBonus);e.hp=clamp(e.hp-dmg,0,e.maxHp);rollmsg(`${r.natural===20?'Crítico · ':''}Daño **${dmg}** (${base.rolls.join('+')}${abilityBonus?fmt(abilityBonus):''})`);if(e.hp<=0){gm(`El golpe termina el enfrentamiento. **${e.name}** cae y deja de ser una amenaza.`);sys('Combate finalizado.');remember(`Derrotaste a ${e.name}.`,true);game.combat=null;game.status='exploration';game.world.tension=clamp(game.world.tension-6,0,100);return}gm(`Impactas. ${e.name} queda **${enemyState(e)}**.`)}else gm(`Tu ataque falla. **${e.name}** aprovecha el hueco que dejas.`);if(game.combat){game.combat.turn='enemy';setTimeout(()=>{if(game?.combat)enemyTurn()},250)}}
function enemyTurn(){const c=game?.combat;if(!c)return;const e=c.enemy;const r=d20(e.attack,'normal');const hit=r.natural===20||r.total>=game.character.ac;rollmsg(`${e.name} ataca: **${r.natural}** ${fmt(e.attack)} = **${r.total}** vs CA ${game.character.ac}`);if(hit){const d=rolls(r.natural===20?'2d6+1':e.damage);game.character.hp=clamp(game.character.hp-d.total,0,game.character.maxHp);gm(`${e.name} te alcanza. Recibes **${d.total} HP** de daño.`);if(game.character.hp<=0){defeat(`${e.name} te derriba. La escena se apaga antes de que puedas reaccionar.`);persist();render();return}}else gm(`${e.name} falla. El ataque pasa demasiado cerca, pero no te alcanza.`);c.round++;c.turn='player';persist();render()}
function resolveEscape(r,p){if(r.total>=p.dc||r.natural===20){gm('Encuentras una apertura y rompes el combate antes de que tu enemigo pueda cerrarte el paso.');sys('Escapaste del combate.');game.combat=null;game.status='exploration'}else{gm('No encuentras la salida. Tu enemigo mantiene la presión.');if(game.combat){game.combat.turn='enemy';setTimeout(()=>enemyTurn(),250)}}}
function enemyState(e){const x=e.hp/e.maxHp;return x>.75?'prácticamente ileso':x>.45?'herido':x>.18?'muy herido':'al borde de caer'}
function defeat(text){gm(`**Has caído.**\n\n${text}`);game.status='defeat';game.combat=null;game.pending=null;sys('La campaña queda guardada en este punto. Puedes cargar una copia anterior o comenzar otra historia.')}
function advanceTime(){if(!game)return;game.world.phase++;if(game.world.phase%3===0){const phases=['Mañana','Mediodía','Tarde','Atardecer','Noche','Madrugada'];const idx=Math.floor(game.world.phase/3);game.world.time=`Día ${1+Math.floor(idx/phases.length)} · ${phases[idx%phases.length]}`}}
function animateRoll(sides,result,done){ui.rolling=true;ui.rollPreview={sides,result,show:'?'};render();setTimeout(()=>{ui.rollPreview.show=result;render();setTimeout(()=>{ui.rolling=false;ui.rollPreview=null;done()},520)},850)}
function quickDie(sides){if(ui.rolling)return;const r=die(sides);animateRoll(sides,r,()=>{if(game){rollmsg(`Tirada libre d${sides}: **${r}**`);persist();render()}else render()})}
function quickExpr(){const ex=prompt('Expresión de dados, por ejemplo 2d6+3');if(!ex)return;try{const r=rolls(ex);if(game){rollmsg(`${r.expr}: [${r.rolls.join(', ')}] ${r.modifier?fmt(r.modifier):''} = **${r.total}**`);persist();render()}else alert(`${r.expr} = ${r.total}`)}catch{alert('Expresión inválida. Ejemplos: 1d20, 2d6+3, 3d8-1')}}
function messageHtml(m){const speaker=m.role==='gm'?'Dungeon Master':m.role==='user'?game.character.name:m.role==='roll'?'Dados':'Sistema';const body=esc(m.text).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');return `<div class="msg ${m.role}"><span class="speaker">${esc(speaker)}</span>${body}</div>`}
function left(){if(!game)return `<div class="panel"><div class="panel-head"><div class="brand"><div class="sigil">✦</div><div><h3>AstraQuest</h3><div class="small">Sin campaña</div></div></div></div><div class="panel-body"><p class="muted small">Crea o carga una campaña para comenzar.</p></div></div>`;const c=game.character, hp=Math.round((c.hp/c.maxHp)*100);return `<div class="panel"><div class="panel-head"><div class="brand"><div class="sigil">✦</div><div><h3>Personaje</h3><div class="small">Nivel ${c.level}</div></div></div><span class="chip gold">PB ${fmt(c.proficiency)}</span></div><div class="panel-body"><div class="character-name">${esc(c.name)}</div><div class="small">${esc(c.ancestry)} · ${esc(c.className)} · ${esc(c.background)}</div><div class="chips"><span class="chip ${c.hp<=c.maxHp*.35?'bad':'good'}">HP ${c.hp}/${c.maxHp}</span><span class="chip">CA ${c.ac}</span><span class="chip">Oro ${c.gold}</span></div><div class="hpbar"><div class="hpfill" style="width:${hp}%"></div></div><div class="stats">${ABILS.map(a=>`<div class="stat"><span>${a}</span><b>${c.attrs[a]}</b><em>${fmt(mod(c.attrs[a]))}</em></div>`).join('')}</div><div class="hr"></div><div class="resource-list"><div class="resource"><span>Ubicación</span><b>${esc(game.world.currentLocation)}</b></div><div class="resource"><span>Hora</span><b>${esc(game.world.time)}</b></div><div class="resource"><span>Estado</span><b>${game.status==='combat'?'Combate':game.status==='defeat'?'Caído':'Exploración'}</b></div></div></div></div><div class="panel"><div class="panel-head"><h3>Tensión</h3><span class="small">${game.world.tension}%</span></div><div class="panel-body"><div class="tension"><span style="width:${game.world.tension}%"></span></div><div class="small" style="margin-top:9px">La tensión sube con fallos, ruido y peligro. Baja al resolver conflictos o descansar.</div></div></div>`}
function main(){if(!game)return `<div class="panel story-panel"><div class="story-head"><div><div class="story-title">AstraQuest V2</div><div class="story-sub">RPG narrativo · Dados reales · DM local</div></div></div><div class="chat"><div class="msg system"><span class="speaker">Sistema</span>Crea una campaña o carga una partida.</div></div></div>`;const pending=!!game.pending,defeat=game.status==='defeat';return `<div class="panel story-panel"><div class="story-head"><div><div class="story-title">${esc(game.title)}</div><div class="story-sub">${esc(game.genre)} · ${esc(game.tone)} · ${esc(game.difficulty)} · ${ai.ready?'IA local':'DM local + IA disponible'}</div></div><div class="story-actions"><button class="btn ghost sm" onclick="AQ.save()">Guardar</button><button class="btn ghost sm" onclick="AQ.exportSave()">Exportar</button><button class="btn ghost sm" onclick="AQ.menu()">Menú</button></div></div><div class="chat" id="chat">${game.chat.map(messageHtml).join('')}</div><div class="composer"><div class="quick-actions"><button class="quick" onclick="AQ.prefill('Observo la escena con atención.')">Observar</button><button class="quick" onclick="AQ.prefill('Hablo con la persona más cercana.')">Hablar</button><button class="quick" onclick="AQ.prefill('Investigo buscando pistas.')">Investigar</button><button class="quick" onclick="AQ.prefill('Intento avanzar con sigilo.')">Sigilo</button><button class="quick" onclick="AQ.prefill('Ataco al enemigo.')">Atacar</button></div><div class="compose-row"><textarea id="input" placeholder="${ai.busy?'El Dungeon Master está narrando…':'¿Qué haces?'}" ${pending||defeat||ai.busy?'disabled':''}></textarea><button class="btn" onclick="AQ.submit()" ${pending||defeat||ai.busy?'disabled':''}>${ai.busy?'Narrando…':'Enviar'}</button></div>${pending?`<div class="note" style="margin-top:9px">Hay una tirada pendiente. La historia está bloqueada hasta resolverla.</div>`:ai.busy?`<div class="note" style="margin-top:9px"><span class="thinking">Dungeon Master <i></i><i></i><i></i></span></div>`:''}</div></div>`}
function right(){return `<div class="panel"><div class="panel-head"><div><h3>Dungeon Master IA</h3><div class="small">Gratis · local · sin cuenta · sin API key</div></div></div><div class="panel-body" id="aiStatusLive">${aiStatusInner()}</div></div><div class="panel"><div class="panel-head"><h3>Panel de juego</h3><div class="tabs">${[['guide','Cómo jugar'],['dice','Dados'],['quests','Misiones'],['inventory','Inventario'],['memory','Memoria']].map(x=>`<button class="tab ${ui.tab===x[0]?'active':''}" onclick="AQ.tab('${x[0]}')">${x[1]}</button>`).join('')}</div></div><div class="panel-body">${tabBody()}</div></div>${game?.combat?combatPanel():''}`}
function tabBody(){if(ui.tab==='dice')return diceTab();if(ui.tab==='quests')return game?`<div class="cards">${game.quests.map(q=>`<div class="card"><div class="card-title">${esc(q.title)}</div><p>${esc(q.desc)}</p><div class="chips"><span class="chip gold">${esc(q.status)}</span></div></div>`).join('')}</div>`:'<p class="muted small">Sin campaña.</p>';if(ui.tab==='inventory')return game?`<div class="cards">${game.character.inventory.map(i=>`<div class="resource"><span>${esc(i.name)}</span><b>×${i.qty}</b></div>`).join('')}<div class="resource"><span>Dinero</span><b>${game.character.gold}</b></div></div>`:'<p class="muted small">Sin campaña.</p>';if(ui.tab==='memory')return game?`<div class="cards"><div class="card"><div class="card-title">Pistas</div><p>${game.clues.length?game.clues.map(c=>`• ${esc(c.text)}`).join('<br>'):'Todavía no has descubierto pistas firmes.'}</p></div><div class="card"><div class="card-title">NPC conocidos</div><p>${game.npcs.map(n=>`• ${esc(n.name)} — ${esc(n.role)} · confianza ${n.trust}`).join('<br>')}</p></div><div class="card"><div class="card-title">Lugares</div><p>${game.locations.map(l=>`• ${esc(l.name)}`).join('<br>')}</p></div></div>`:'<p class="muted small">Sin campaña.</p>';return `<div class="cards"><div class="card"><div class="card-title">Tu parte</div><p>Describe libremente qué intenta hacer tu personaje. El juego no decidirá por ti.</p></div><div class="card"><div class="card-title">Cuándo se tiran dados</div><p>Acciones inciertas o peligrosas activan una prueba. El motor calcula modificadores y la narración queda bloqueada hasta tirar.</p></div><div class="card"><div class="card-title">Pruebas</div><p>Normalmente: <b>1d20 + modificador</b> contra una DC. Ventaja usa 2d20 y toma el mayor; desventaja toma el menor.</p></div><div class="card"><div class="card-title">Combate</div><p>Se tira iniciativa, luego ataque contra CA y daño con su propio dado. Los enemigos no muestran sus HP exactos: solo su estado.</p></div><div class="note">AstraQuest puede usar una IA real directamente en el navegador con WebGPU. No necesita cuenta ni API key: el modelo se ejecuta en el equipo del jugador. La primera carga descarga el modelo; después el navegador intenta reutilizarlo desde caché. Si la IA no está disponible, el DM local sigue funcionando como respaldo.</div></div>`}
function diceTab(){return `${game?.pending?`<div class="pending"><div class="eyebrow">Tirada obligatoria</div><div class="pending-title">${esc(game.pending.skill)}</div><div class="pending-meta">${esc(game.pending.ability)} · DC ${game.pending.dc} · ${fmt(game.pending.modifier)}</div><div class="pending-actions"><button class="btn gold" onclick="AQ.resolve('normal')">Tirar d20</button><button class="btn secondary" onclick="AQ.resolve('advantage')">Ventaja</button><button class="btn danger" onclick="AQ.resolve('disadvantage')">Desventaja</button></div></div>`:''}<div class="dice-grid">${[4,6,8,10,12,20,100].map(s=>`<button class="dice-button" onclick="AQ.quick(${s})"><div class="die-gem"><span>d${s}</span></div><small>Lanzar</small></button>`).join('')}<button class="dice-button" onclick="AQ.expr()"><div class="die-gem"><span>XdY</span></div><small>Expresión</small></button></div>`}
function combatPanel(){const e=game.combat.enemy;return `<div class="panel"><div class="panel-head"><h3>Combate · ronda ${game.combat.round}</h3><span class="chip bad">${game.combat.turn==='player'?'Tu turno':'Turno enemigo'}</span></div><div class="panel-body"><div class="combat-banner"><div class="combat-side"><div class="small">${esc(game.character.name)}</div><b>${game.character.hp}/${game.character.maxHp} HP</b></div><div class="combat-side"><div class="small">${esc(e.name)}</div><b class="enemy-state">${enemyState(e)}</b></div></div><div class="hr"></div><div class="small">Iniciativa: ${game.character.name} ${game.combat.initiative.player} · ${e.name} ${game.combat.initiative.enemy}</div><div class="footer-actions"><button class="btn" ${game.combat.turn!=='player'||game.pending?'disabled':''} onclick="AQ.prefill('Ataco al enemigo.')">Atacar</button><button class="btn ghost" ${game.combat.turn!=='player'||game.pending?'disabled':''} onclick="AQ.prefill('Intento huir del combate.')">Huir</button></div></div></div>`}
function modal(){if(!ui.modal)return'';const all=saves();return `<div class="modalback"><div class="modal"><div class="modal-top"><div class="brand"><div class="sigil">✦</div><div><b>AstraQuest V2</b><div class="small">RPG narrativo con dados</div></div></div>${game?`<button class="btn ghost sm" onclick="AQ.closeMenu()">Volver al juego</button>`:''}</div><div class="modal-body">${ui.modalMode==='new'?newForm():home(all)}</div></div></div>`}
function home(all){return `<div class="hero"><div class="hero-box"><div class="eyebrow">Versión jugable</div><h1>Una aventura que responde a tus decisiones.</h1><p class="muted">Crea cualquier premisa, controla tu personaje y deja que los dados decidan cuándo el mundo te concede lo que intentas.</p><div class="footer-actions" style="justify-content:flex-start"><button class="btn gold" onclick="AQ.newCampaign()">Nueva campaña</button><button class="btn secondary" onclick="AQ.importSave()">Importar save</button></div></div><div class="hero-box"><div class="card-title">V2 + IA local sin API</div><p class="muted small">✓ entra sin cuenta ni clave API<br>✓ IA narrativa ejecutándose en tu PC<br>✓ creación libre de campaña<br>✓ ficha estilo d20<br>✓ d4–d100 + expresiones<br>✓ ventaja/desventaja<br>✓ tiradas bloqueantes<br>✓ combate por iniciativa<br>✓ pistas, NPC y lugares<br>✓ guardado/exportación<br>✓ fallback DM local</p><div class="note" style="margin-top:11px">La primera vez tendrás que descargar el modelo elegido. Después queda cacheado por el navegador siempre que no borres sus datos.</div></div></div><div class="hr"></div><div class="card-title">Campañas guardadas</div><div class="cards" style="margin-top:10px">${all.length?all.map(saveItem).join(''):`<div class="card"><p>No hay campañas todavía.</p></div>`}</div>`}
function saveItem(s){return `<div class="saveitem"><div><b>${esc(s.title)}</b><div class="small">${esc(s.character?.name||'')} · ${esc(s.world?.currentLocation||'')} · ${new Date(s.updatedAt||s.createdAt).toLocaleString()}</div></div><div class="save-actions"><button class="btn sm" onclick="AQ.load('${s.id}')">Cargar</button><button class="btn ghost sm" onclick="AQ.duplicate('${s.id}')">Duplicar</button><button class="btn danger sm" onclick="AQ.remove('${s.id}')">Eliminar</button></div></div>`}
function newForm(){return `<div class="eyebrow">Nueva campaña</div><h2 style="margin:5px 0 14px">Cuéntale al juego qué quieres vivir</h2><form id="newForm" onsubmit="AQ.create(event)"><div class="form-grid"><div class="form-col"><div><label>Título</label><input class="field" name="title" value="La noche no terminó" required></div><div><label>Premisa libre</label><textarea class="field textarea-lg" name="premise" required>Estoy en Santiago de Chile en 1998. Soy un detective privado y una desaparición aparentemente normal empieza a conectarse con criaturas que nadie más parece ver.</textarea></div><div class="form-grid"><div><label>Género</label><select class="field" name="genre"><option>Detective sobrenatural</option><option>Fantasía oscura</option><option>Terror</option><option>Postapocalíptico</option><option>Piratas fantásticos</option><option>Aventura libre</option></select></div><div><label>Tono</label><select class="field" name="tone"><option>Serio y atmosférico</option><option>Oscuro</option><option>Aventura</option><option>Misterio</option></select></div></div><div><label>Dificultad</label><select class="field" name="difficulty"><option>Normal</option><option>Difícil</option><option>Letal</option></select></div></div><div class="form-col"><div class="form-grid"><div><label>Nombre</label><input class="field" name="name" value="Adrián" required></div><div><label>Linaje</label><input class="field" name="ancestry" value="Humano"></div></div><div class="form-grid"><div><label>Clase / arquetipo</label><input class="field" name="className" value="Investigador"></div><div><label>Trasfondo</label><input class="field" name="background" value="Detective privado"></div></div><div class="form-grid">${ABILS.map((a,i)=>`<div><label>${a}</label><input class="field" type="number" min="3" max="20" name="${a}" value="${[10,14,12,14,13,12][i]}"></div>`).join('')}</div><div class="form-grid"><div><label>HP</label><input class="field" type="number" min="1" max="99" name="maxHp" value="14"></div><div><label>CA</label><input class="field" type="number" min="5" max="30" name="ac" value="13"></div></div><div><label>Dinero inicial</label><input class="field" type="number" min="0" name="gold" value="20"></div></div></div><div class="footer-actions"><button type="button" class="btn ghost" onclick="AQ.menu()">Cancelar</button><button class="btn gold" type="submit">Comenzar aventura</button></div></form>`}
function rollOverlay(){if(!ui.rolling||!ui.rollPreview)return'';return `<div class="roll-stage"><div class="roll-card"><div class="eyebrow">Lanzando d${ui.rollPreview.sides}</div><div class="roll-scene"><div class="big-die rolling"><span>${ui.rollPreview.show}</span></div></div><div class="roll-result">${ui.rollPreview.show}</div><div class="roll-caption">El resultado pertenece al motor de dados, no al Dungeon Master.</div></div></div>`}
function render(){el.innerHTML=`<div class="app"><div class="col left">${left()}</div><div class="col main">${main()}</div><div class="col right">${right()}</div></div>${modal()}${rollOverlay()}`;const c=document.getElementById('chat');if(c)c.scrollTop=c.scrollHeight}
function exportSave(){if(!game)return;const blob=new Blob([JSON.stringify(game,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=(game.title||'campana').toLowerCase().replace(/[^a-z0-9áéíóúñ]+/gi,'-')+'.json';a.click();URL.revokeObjectURL(u)}
function importSave(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{const f=i.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x?.id||!x?.character||!Array.isArray(x.chat))throw Error();const all=saves();const idx=all.findIndex(s=>s.id===x.id);idx>=0?all[idx]=x:all.unshift(x);localStorage.setItem(K,JSON.stringify(all));render()}catch{alert('Save inválido')}};r.readAsText(f)};i.click()}
window.AQ={
 tab:t=>{ui.tab=t;render()},menu:()=>{ui.modal=true;ui.modalMode='home';render()},closeMenu:()=>{ui.modal=false;render()},newCampaign:()=>{ui.modalMode='new';render()},
 create:e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));newGame(d,d);ui.modal=false;render();ensureLocalAI()},
 submit:()=>{const i=document.getElementById('input');if(i&&i.value.trim()&&!ai.busy){const t=i.value;i.value='';submit(t)}},prefill:t=>{const i=document.getElementById('input');if(i&&!i.disabled&&!ai.busy){i.value=t;i.focus()}},
 aiStart:()=>ensureLocalAI(),aiModel:m=>{if(ai.loading||ai.ready)return;if(AI_MODELS[m]){ai.mode=m;localStorage.setItem(AI_MODE_KEY,m);ai.progress='Modelo seleccionado. Se descargará al activar la IA.';paintAIStatus()}},
 resolve:resolvePending,quick:quickDie,expr:quickExpr,save:()=>{persist();alert('Partida guardada.')},exportSave,importSave,
 load:id=>{const s=saves().find(x=>x.id===id);if(s){game=structuredClone(s);localStorage.setItem(A,id);ui.modal=false;render();ensureLocalAI()}},
 duplicate:id=>{const all=saves(),s=all.find(x=>x.id===id);if(!s)return;const c=structuredClone(s);c.id=uid();c.title+=' (copia)';c.updatedAt=now();all.unshift(c);localStorage.setItem(K,JSON.stringify(all));render()},
 remove:id=>{if(!confirm('¿Eliminar esta campaña?'))return;localStorage.setItem(K,JSON.stringify(saves().filter(x=>x.id!==id)));if(game?.id===id)game=null;render()}
};
const active=localStorage.getItem(A);if(active){const s=saves().find(x=>x.id===active);if(s)game=structuredClone(s)}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&document.activeElement?.id==='input')AQ.submit()});
render();
})();
</script>
</body>
</html>
